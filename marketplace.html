<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Marketplace | AutoValue</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/marketplace.css" />
  </head>

  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="AutoValue" />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navlinks"
        >
          ☰
        </button>

        <div class="navlinks" id="navlinks">
          <a href="index.html">Home</a>
          <a href="estimate.html">Estimate</a>
          <a href="marketplace.html" class="active">Marketplace</a>
          <a href="market-insights.html">Market Insights</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="marketplace">
        <div class="marketplace-header">
          <h1>EXPLORE OUR MARKETPLACE</h1>
          <p>
            Discover a selection of used cars and find the perfect vehicle for
            you.
          </p>
        </div>

        <div class="marketplace-filters">
          <div class="filter-group">
            <label for="filter-brand">Brand</label>

            <select id="filter-brand">
              <option value="">All Brands</option>
            </select>
          </div>

          <div class="filter-group">
            <label for="filter-price">Maximum Price</label>

            <select id="filter-price">
              <option value="">Any Price</option>
              <option value="20000">Up to €20,000</option>
              <option value="30000">Up to €30,000</option>
              <option value="50000">Up to €50,000</option>
              <option value="100000">Up to €100,000</option>
            </select>
          </div>

          <button type="button" id="reset-filters">Reset Filters</button>
        </div>

        <div id="car-listings" class="car-listings">
          <!-- Car cards will be generated by JavaScript -->
        </div>

        <p id="no-results" hidden>No vehicles found matching your filters.</p>
      </section>
    </main>

    <footer>
      <p>AutoValue - Web Development Project - 2026</p>
    </footer>

    <script src="javascript/navbar.js"></script>
    <script src="javascript/marketplace.js"></script>
  </body>
</html>
