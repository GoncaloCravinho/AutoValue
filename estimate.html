<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estimate Your Car | AutoValue</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/estimate.css" />
  </head>

  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="AutoValue" />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navlinks"
        >
          ☰
        </button>

        <div class="navlinks" id="navlinks">
          <a href="index.html">Home</a>
          <a href="estimate.html" class="active">Estimate</a>
          <a href="marketplace.html">Marketplace</a>
          <a href="market-insights.html">Market Insights</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="estimate">
        <h1>ESTIMATE YOUR CAR</h1>
        <p>
          Enter your car's characteristics and get an estimate of its market
          value.
        </p>
        <form id="estimate-form">
          <!-- Brand -->
          <div class="form-group">
            <label for="brand">Brand</label>

            <select id="brand" name="brand" required>
              <option value="" disabled selected>Select a brand</option>
            </select>
          </div>

          <!-- Model -->
          <div class="form-group">
            <label for="model">Model</label>

            <select id="model" name="model" required>
              <option value="" disabled selected>Select a brand first</option>
            </select>
          </div>

          <!-- Year -->
          <div class="form-group">
            <label for="year">Year</label>

            <input
              type="number"
              id="year"
              name="year"
              min="1967"
              max="2026"
              required
            />
          </div>

          <!-- Mileage -->
          <div class="form-group">
            <label for="mileage">Mileage (km)</label>

            <input
              type="number"
              id="mileage"
              name="mileage"
              min="0"
              max="1000000"
              required
            />
          </div>

          <!-- Fuel -->
          <div class="form-group">
            <label for="fuel">Fuel</label>

            <select id="fuel" name="fuel" required>
              <option value="" disabled selected>Select a type of Fuel</option>
              <option value="Gasoline">Gasoline</option>
              <option value="Diesel">Diesel</option>
              <option value="Hybrid">Hybrid</option>
              <option value="Electric">Electric</option>
            </select>
          </div>

          <!-- Transmission -->
          <div class="form-group">
            <label for="transmission">Transmission</label>

            <select id="transmission" name="transmission" required>
              <option value="" disabled selected>
                Select a type of Transmission
              </option>
              <option value="Manual">Manual</option>
              <option value="Automatic">Automatic</option>
            </select>
          </div>

          <!-- Power -->
          <div class="form-group power-group">
            <label for="power">Power (hp)</label>
            <input
              type="number"
              id="power"
              name="power"
              min="5"
              max="1050"
              required
            />
          </div>

          <button type="submit" class="estimate-button">Estimate Price</button>
        </form>

        <div id="result" class="result">
          <h2>ESTIMATED VALUE</h2>
          <p id="estimated-price">€24 850</p>
          <h3 id="result-car">BMW 3 Series</h3>
          <p id="result-details">2020 • 75,000 km • Diesel • Automatic</p>

          <div class="results-actions">
            <button type="button" id="new-estimate">New Estimate</button>
            <a href="#" class="insights-button">Market Insights</a>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>AutoValue - Web Development Project - 2026</p>
    </footer>

    <script src="js/estimate.js"></script>
  </body>
</html>
