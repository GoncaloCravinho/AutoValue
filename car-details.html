<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Car Details | AutoValue</title>

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/car-details.css" />
  </head>

  <body>
    <header>
      <nav>
        <a href="index.html" class="logo">
          <img src="images/logo.png" alt="AutoValue" />
        </a>

        <button
          class="menu-toggle"
          type="button"
          aria-label="Open menu"
          aria-expanded="false"
          aria-controls="navlinks"
        >
          ☰
        </button>

        <div class="navlinks" id="navlinks">
          <a href="index.html">Home</a>
          <a href="estimate.html">Estimate</a>
          <a href="marketplace.html" class="active">Marketplace</a>
          <a href="market-insights.html">Market Insights</a>
          <a href="login.html">Login</a>
        </div>
      </nav>
    </header>

    <main class="car-details-page">
      <div class="car-details">
        <a href="marketplace.html" class="back-link"> ← Back to Marketplace </a>

        <section class="car-gallery">
          <img id="main-image" src="" alt="Car main image" />

          <div id="car-thumbnails" class="car-thumbnails">
            <!-- Images generated by JavaScript -->
          </div>
        </section>

        <section class="car-information">
          <div class="car-overview">
            <div>
              <h1 id="car-title"></h1>
              <p id="car-summary"></p>
            </div>

            <h2 id="car-price"></h2>
          </div>

          <div class="car-specifications">
            <h2>Vehicle Specifications</h2>

            <div class="specifications-grid">
              <div class="specification">
                <span>Brand</span>
                <p id="car-brand"></p>
              </div>

              <div class="specification">
                <span>Model</span>
                <p id="car-model"></p>
              </div>

              <div class="specification">
                <span>Year</span>
                <p id="car-year"></p>
              </div>

              <div class="specification">
                <span>Mileage</span>
                <p id="car-mileage"></p>
              </div>

              <div class="specification">
                <span>Fuel</span>
                <p id="car-fuel"></p>
              </div>

              <div class="specification">
                <span>Transmission</span>
                <p id="car-transmission"></p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <p>AutoValue - Web Development Project - 2026</p>
    </footer>

    <script src="javascript/navbar.js"></script>
    <script src="javascript/car-details.js"></script>
  </body>
</html>
